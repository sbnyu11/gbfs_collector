name: Collect GBFS status

on:
  schedule:
    - cron: "*/60 * * * *"   # every 60 minutes (UTC)
  workflow_dispatch:          # adds a manual "Run workflow" button

permissions:
  contents: write             # lets the job push data back to the repo

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # prebuilt binaries, much faster installs

      - name: Install packages
        run: Rscript -e 'install.packages(c("gbfs", "dplyr", "readr"))'

      - name: Run collection script
        run: Rscript collect_status.R

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Data pull $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
